name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - CustomerManagement.web/**
      - .github/workflows/ci.yml

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: CustomerManagement.web/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: CustomerManagement.web
        run: npm ci

      - name: Lint ausführen
        working-directory: CustomerManagement.web
        run: npm run lint

  test-and-build:
    name: Test & Build
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: CustomerManagement.web/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: CustomerManagement.web
        run: npm ci

      - name: Tests mit Coverage ausführen
        working-directory: CustomerManagement.web
        run: npm run test:coverage

      - name: Coverage-Report hochladen
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: CustomerManagement.web/coverage
          retention-days: 14

      - name: Build ausführen
        working-directory: CustomerManagement.web
        run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: CustomerManagement.web/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: CustomerManagement.web
        run: npm ci

      - name: Playwright-Version ermitteln
        id: playwright-version
        working-directory: CustomerManagement.web
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT

      - name: Playwright-Browser-Cache
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}

      - name: Playwright-Browser installieren
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: CustomerManagement.web
        run: npx playwright install --with-deps chromium

      - name: System-Abhängigkeiten für Chromium installieren
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: CustomerManagement.web
        run: npx playwright install-deps chromium

      - name: E2E-Tests ausführen
        working-directory: CustomerManagement.web
        run: npm run test:e2e

      - name: Playwright-Report hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: CustomerManagement.web/playwright-report
          retention-days: 14

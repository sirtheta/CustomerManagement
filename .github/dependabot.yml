version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/CustomerManagement.web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 50
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@typescript-eslint/*"
